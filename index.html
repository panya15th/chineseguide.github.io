<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ครูจีนด้วยภาพ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Direction: monochrome ink chrome; colour is reserved for grammar roles and tones, so every colour on screen means something. */
:root{
  --bg:#f4f5f7; --surface:#ffffff; --surface2:#eef0f4; --ink:#1a1f2e; --muted:#5a6275; --line:#dde1e8;
  --accent:#1a1f2e; --on-accent:#ffffff;
  --subj:#2563c9; --verb:#cf3636; --obj:#1f8a4f; --place:#d96d12; --part:#6f7788;
  --subj-bg:#e3edfb; --verb-bg:#fbe6e6; --obj-bg:#def3e7; --place-bg:#fcebdb; --part-bg:#eceef2;
  --num:#8a4bd1; --num-bg:#efe6fb;
  --t1:#2563c9; --t2:#1f8a4f; --t3:#d96d12; --t4:#cf3636; --t0:#6f7788;
  --good:#1f8a4f; --bad:#cf3636;
  --font-th:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-zh:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12151d; --surface:#1a1f2b; --surface2:#232937; --ink:#eceff5; --muted:#9aa3b6; --line:#2f3647;
    --accent:#eceff5; --on-accent:#12151d;
    --subj:#6aa3ff; --verb:#ff7a7a; --obj:#4fd08a; --place:#ffa24d; --part:#a2aabd;
    --subj-bg:#1b2a46; --verb-bg:#3a2024; --obj-bg:#173126; --place-bg:#38271a; --part-bg:#272d3b;
    --num:#c19bff; --num-bg:#2d2243;
    --t1:#6aa3ff; --t2:#4fd08a; --t3:#ffa24d; --t4:#ff7a7a; --t0:#a2aabd;
    --good:#4fd08a; --bad:#ff7a7a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12151d; --surface:#1a1f2b; --surface2:#232937; --ink:#eceff5; --muted:#9aa3b6; --line:#2f3647;
  --accent:#eceff5; --on-accent:#12151d;
  --subj:#6aa3ff; --verb:#ff7a7a; --obj:#4fd08a; --place:#ffa24d; --part:#a2aabd;
  --subj-bg:#1b2a46; --verb-bg:#3a2024; --obj-bg:#173126; --place-bg:#38271a; --part-bg:#272d3b;
    --num:#c19bff; --num-bg:#2d2243;
  --t1:#6aa3ff; --t2:#4fd08a; --t3:#ffa24d; --t4:#ff7a7a; --t0:#a2aabd;
  --good:#4fd08a; --bad:#ff7a7a;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-th);line-height:1.6;font-size:16px}
.zh{font-family:var(--font-zh)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--subj);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 56px}
header{padding:20px 0 8px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:1.65rem;line-height:1.2;text-wrap:balance}
.sub{color:var(--muted);font-size:.92rem;margin-top:2px}
.prog{font-size:.85rem;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px}
nav{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0;border-bottom:1px solid var(--line);margin-bottom:16px}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 16px;font-weight:500}
.tab[aria-selected="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
h2{font-size:1.25rem;margin:0 0 10px;text-wrap:balance}
h3{font-size:1.02rem;margin:22px 0 8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.grid{display:grid;gap:12px}
.lessons{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.lcard{text-align:left;display:flex;flex-direction:column;gap:4px;transition:transform .15s}
.lcard:hover{transform:translateY(-2px)}
.lcard.locked{opacity:.8;border-style:dashed}
.lcard .big{font-size:2.2rem;line-height:1}
.lcard .zhT{font-family:var(--font-zh);font-weight:700;font-size:1.2rem}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:500}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.primary:hover{opacity:.9;background:var(--accent)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.back{margin-bottom:10px}
/* tones + roles */
.t{font-weight:600}
.t1{color:var(--t1)}.t2{color:var(--t2)}.t3{color:var(--t3)}.t4{color:var(--t4)}.t0{color:var(--t0)}
.r-num{color:var(--num)}.r-subj{color:var(--subj)}.r-verb{color:var(--verb)}.r-obj{color:var(--obj)}.r-place{color:var(--place)}.r-part{color:var(--part)}
.b-num{background:var(--num-bg);border-color:var(--num);color:var(--num)}
.b-subj{background:var(--subj-bg);border-color:var(--subj);color:var(--subj)}
.b-verb{background:var(--verb-bg);border-color:var(--verb);color:var(--verb)}
.b-obj{background:var(--obj-bg);border-color:var(--obj);color:var(--obj)}
.b-place{background:var(--place-bg);border-color:var(--place);color:var(--place)}
.b-part{background:var(--part-bg);border-color:var(--part);color:var(--part)}
.legend{display:flex;gap:6px;flex-wrap:wrap;font-size:.8rem}
.chip{border:1px solid;border-radius:999px;padding:1px 10px;font-weight:500}
/* scene board */
.scene{border-radius:16px;padding:14px;border:1px solid var(--line);background:var(--surface2)}
.scene-cap{font-size:.85rem;color:var(--muted);margin-bottom:10px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 8px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}
.tile .em{font-size:2.3rem;line-height:1.1}
.tile .hz{font-family:var(--font-zh);font-size:1.5rem;font-weight:700;line-height:1.2}
.tile .py{font-size:.9rem}
.tile .th{font-size:.84rem;color:var(--muted)}
.tile .tip{font-size:.76rem;color:var(--muted);margin-top:4px;border-top:1px dashed var(--line);padding-top:4px;text-align:left}
.spk{display:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;width:30px;height:30px;line-height:1;padding:0;font-size:.95rem}
body.has-tts .spk{display:inline-flex;align-items:center;justify-content:center}
.ask{border:1px dashed var(--line);background:transparent;border-radius:999px;font-size:.76rem;padding:2px 10px;color:var(--muted)}
.ask:hover{background:var(--surface2)}
/* grammar */
.gdiag{display:flex;gap:6px;align-items:stretch;flex-wrap:wrap}
.gbox{border:2px solid;border-radius:12px;padding:8px 12px;text-align:center;min-width:76px}
.gbox .zh{font-size:1.4rem;font-weight:700;line-height:1.3}
.gbox .l{font-size:.75rem}
.arrow{align-self:center;color:var(--muted);font-size:1.2rem}
.ex{display:grid;gap:2px;padding:10px 0;border-top:1px solid var(--line)}
.ex:first-child{border-top:0}
.ex .zh{font-size:1.4rem;font-weight:500}
.lvl{font-size:.72rem;border:1px solid var(--line);border-radius:999px;padding:0 8px;color:var(--muted);margin-left:6px;vertical-align:middle}
.trap{border-left:4px solid var(--place);background:var(--place-bg);border-radius:8px;padding:8px 12px;font-size:.92rem;margin-top:10px}
.note{border-left:4px solid var(--part);background:var(--part-bg);border-radius:8px;padding:8px 12px;font-size:.92rem;margin-top:10px}
/* dialog */
.dlg{display:grid;gap:10px}
.bub{max-width:88%;border-radius:14px;padding:8px 12px;border:1px solid var(--line);background:var(--surface)}
.bub.me{margin-left:auto;background:var(--subj-bg);border-color:var(--subj)}
.bub .who{font-size:.72rem;color:var(--muted)}
.bub .zh{font-size:1.25rem}
.sw{display:flex;gap:14px;margin:6px 0 10px;font-size:.9rem}
.sw label{display:flex;gap:6px;align-items:center;cursor:pointer}
.hide-py .pyl{display:none}.hide-th .thl{display:none}
/* flashcards */
.fc{min-height:290px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;cursor:pointer;user-select:none}
.fc .em{font-size:5rem;line-height:1.1}
.fc .hz{font-family:var(--font-zh);font-size:3.2rem;font-weight:700;line-height:1.2}
.fc .py{font-size:1.4rem}
.fc .th{font-size:1.15rem}
.bar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--obj);transition:width .25s}
select{font:inherit;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:7px 10px}
/* quiz */
.opts{display:grid;gap:8px;margin-top:12px}
.opt{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px}
.opt:hover:not([disabled]){background:var(--surface2)}
.opt.ok{background:var(--obj-bg);border-color:var(--obj)}
.opt.no{background:var(--verb-bg);border-color:var(--verb)}
.qbig{font-size:4rem;text-align:center;line-height:1.1}
.qhz{font-family:var(--font-zh);font-size:2.4rem;font-weight:700;text-align:center;line-height:1.2}
.slot{min-height:56px;border:2px dashed var(--line);border-radius:12px;padding:8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
.tk{font-family:var(--font-zh);font-size:1.35rem;font-weight:500;border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:4px 14px}
.fb{margin-top:12px;padding:10px 12px;border-radius:10px;font-size:.95rem}
.fb.ok{background:var(--obj-bg)}.fb.no{background:var(--verb-bg)}
/* tones */
.tgrid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.tcard{text-align:center}
.tcard svg{width:100%;height:auto;max-width:140px}
.tcard .pyb{font-size:1.5rem;font-weight:700}
.pitch path.line{fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.draw{stroke-dasharray:240;stroke-dashoffset:240;animation:dr .9s ease forwards}
@keyframes dr{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.draw{animation:none;stroke-dashoffset:0}.lcard{transition:none}}
/* chat */
.chat{display:grid;gap:10px;margin-bottom:12px}
.msg{padding:10px 14px;border-radius:14px;max-width:92%;border:1px solid var(--line);background:var(--surface);overflow-wrap:anywhere}
.msg.user{margin-left:auto;background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.cinput{display:flex;gap:8px;align-items:flex-end}
textarea{flex:1;font:inherit;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px 12px;resize:vertical;min-height:48px;max-height:180px}
.dots::after{content:"…";animation:bl 1s infinite}
@keyframes bl{50%{opacity:.2}}
@media (max-width:460px){.bub{max-width:96%}.fc .hz{font-size:2.6rem}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>ครูจีนด้วยภาพ</h1>
      <div class="sub">ภาษาจีนสำหรับเที่ยว 3 ระดับ มีแบบทดสอบก่อนเข้าห้อง</div>
    </div>
    <div class="prog" id="prog" aria-live="polite"></div>
  </header>
  <nav><div class="tabs" role="tablist" id="tabs"></div></nav>
  <main id="view"></main>
</div>

<script>
/* ---------- helpers ---------- */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const TONE_MAP = {ā:1,ē:1,ī:1,ō:1,ū:1,ǖ:1,á:2,é:2,í:2,ó:2,ú:2,ǘ:2,ǎ:3,ě:3,ǐ:3,ǒ:3,ǔ:3,ǚ:3,à:4,è:4,ì:4,ò:4,ù:4,ǜ:4};
const toneOf = s => { for (const c of s) if (TONE_MAP[c]) return TONE_MAP[c]; return 0; };
const pyHTML = arr => arr.map(s => `<span class="t t${toneOf(s)}">${esc(s)}</span>`).join('');
const pyPlain = arr => arr.join('');
const hzHTML = (zh, py) => { const ch = Array.from(zh); return ch.map((c,i)=>`<span class="t t${toneOf(py[i]||'')}">${esc(c)}</span>`).join(''); };
const ROLE_TH = {subj:'ประธาน', num:'จำนวน', verb:'กริยา/ภาคแสดง', obj:'กรรม', place:'เวลา-สถานที่', part:'คำช่วย'};
const segHTML = segs => segs.map(([t,r]) => r ? `<span class="r-${r}">${esc(t)}</span>` : esc(t)).join('');
const legendHTML = () => `<div class="legend">${Object.keys(ROLE_TH).map(r=>`<span class="chip b-${r}">${ROLE_TH[r]}</span>`).join('')}</div>`;

/* ---------- optional capabilities ---------- */
let TTS = null;
if ('speechSynthesis' in window){ TTS = true; document.body.classList.add('has-tts'); }
function say(text){
  if (!TTS) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text); u.lang = 'zh-CN'; u.rate = 0.9;
    const v = speechSynthesis.getVoices().find(x => /zh[-_]CN/i.test(x.lang)) || speechSynthesis.getVoices().find(x => /^zh/i.test(x.lang));
    if (v) u.voice = v;
    speechSynthesis.speak(u);
  } catch(e){}
}
if ('speechSynthesis' in window) speechSynthesis.getVoices();
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};

/* ---------- content ---------- */
const LESSONS_L2 = [
{ id:'food', em:'🍜', zh:'在饭馆', th:'ที่ร้านอาหาร', py:'zài fànguǎn', scene:'ฉากร้านอาหาร: เมนูอยู่บนโต๊ะ พนักงานเดินมารับออเดอร์',
  words:[
   {zh:'菜单', py:['cài','dān'], th:'เมนูอาหาร', em:'📋', tip:'菜 (อาหาร) + 单 (รายการ) = รายการอาหาร'},
   {zh:'服务员', py:['fú','wù','yuán'], th:'พนักงานเสิร์ฟ', em:'🙋', tip:'服务 (บริการ) + 员 (พนักงาน)'},
   {zh:'米饭', py:['mǐ','fàn'], th:'ข้าวสวย', em:'🍚', tip:'米 = ข้าวสาร, 饭 = ข้าวสุก/มื้ออาหาร'},
   {zh:'水', py:['shuǐ'], th:'น้ำ', em:'💧', tip:'เสียง 3 ลงแล้วขึ้น เหมือนทำปากจะ "ชุ่ย"'},
   {zh:'辣', py:['là'], th:'เผ็ด', em:'🌶️', tip:'พูดตอนสั่ง: 不辣 (ไม่เผ็ด), 微辣 (เผ็ดน้อย)'},
   {zh:'买单', py:['mǎi','dān'], th:'เช็กบิล/คิดเงิน', em:'🧾', tip:'买 (ซื้อ) + 单 (บิล) = จ่ายบิล'}
  ],
  grammar:{ title:'我想 + กริยา + กรรม', th:'บอกสิ่งที่อยากทำหรืออยากได้ ใช้สั่งอาหารได้ทันที',
   parts:[{r:'subj',zh:'我',th:'ฉัน'},{r:'verb',zh:'想',th:'อยาก'},{r:'verb',zh:'吃 / 喝',th:'กิน / ดื่ม'},{r:'obj',zh:'米饭 / 水',th:'ข้าว / น้ำ'}],
   examples:[
    {lvl:'ง่าย', s:[['我','subj'],['想','verb'],['喝','verb'],['水','obj'],['。','']], py:'wǒ xiǎng hē shuǐ', th:'ฉันอยากดื่มน้ำ'},
    {lvl:'ง่าย', s:[['我','subj'],['想','verb'],['吃','verb'],['米饭','obj'],['。','']], py:'wǒ xiǎng chī mǐfàn', th:'ฉันอยากกินข้าว'},
    {lvl:'ปานกลาง', s:[['我','subj'],['想','verb'],['吃','verb'],['不辣的','part'],['菜','obj'],['。','']], py:'wǒ xiǎng chī bú là de cài', th:'ฉันอยากกินอาหารที่ไม่เผ็ด'},
    {lvl:'ใช้จริง', s:[['请','verb'],['给','verb'],['我','obj'],['菜单','obj'],['。','']], py:'qǐng gěi wǒ càidān', th:'ขอเมนูหน่อย'}
   ],
   use:'ใช้เมื่อบอกความต้องการแบบสุภาพ ปฏิเสธใช้ 不想 (ไม่อยาก) ส่วน 不要 แปลว่า "ไม่เอา" เสียงหนักกว่า',
   trap:'ตัวขยายอยู่หน้านามเสมอ: 不辣的菜 = "ไม่เผ็ด-ของ-อาหาร" ไทยวางตัวขยายหลังนาม จีนวางไว้ข้างหน้า'},
  dialog:[
   {who:'พนักงาน', me:false, zh:'你好，请问几位？', py:'nǐ hǎo, qǐngwèn jǐ wèi?', th:'สวัสดีค่ะ ทั้งหมดกี่ท่านคะ'},
   {who:'คุณ', me:true, zh:'我们两个人。', py:'wǒmen liǎng ge rén', th:'เรามีสองคน'},
   {who:'พนักงาน', me:false, zh:'这是菜单。', py:'zhè shì càidān', th:'นี่คือเมนูค่ะ'},
   {who:'คุณ', me:true, zh:'我想吃米饭，不要辣的。', py:'wǒ xiǎng chī mǐfàn, bú yào là de', th:'ฉันอยากกินข้าว ไม่เอาเผ็ด'},
   {who:'คุณ', me:true, zh:'服务员，买单！', py:'fúwùyuán, mǎidān!', th:'คิดเงินด้วยครับ/ค่ะ'}
  ]},
{ id:'go', em:'🚇', zh:'问路和交通', th:'ถามทางและเดินทาง', py:'wèn lù hé jiāotōng', scene:'ฉากหน้าสถานีรถไฟใต้ดิน: ถามทางไปสนามบิน',
  words:[
   {zh:'地铁站', py:['dì','tiě','zhàn'], th:'สถานีรถไฟใต้ดิน', em:'🚇', tip:'地 (พื้นดิน) + 铁 (เหล็ก/ราง) + 站 (สถานี)'},
   {zh:'出租车', py:['chū','zū','chē'], th:'แท็กซี่', em:'🚕', tip:'出租 (ให้เช่า) + 车 (รถ)'},
   {zh:'机场', py:['jī','chǎng'], th:'สนามบิน', em:'✈️', tip:'机 (เครื่องบิน) + 场 (ลาน/สนาม)'},

function updateProg(){
  $('#prog').textContent = `ปลดล็อกถึงระดับ ${profile.max} · จำได้ ${known.size}/${ALL.length} คำ · เรียนจบ ${doneLessons.size}/${LESSONS.length} บท`;
}
function renderTabs(){
  $('#tabs').innerHTML = TABS.map(([k,l]) => `<button class="tab" role="tab" aria-selected="${tab===k}" data-tab="${k}">${l}</button>`).join('');
  $('#tabs').querySelectorAll('.tab').forEach(b => b.onclick = () => go(b.dataset.tab));
}
function go(t){ tab = t; test = null; openLevel = null; openLesson = null; renderTabs(); render(); window.scrollTo(0,0); }
function render(){
  updateProg();
  if (test) viewTest(); else ({lessons:viewLessons, cards:viewCards, quiz:viewQuiz, tones:viewTones})[tab]();
  $('#view').querySelectorAll('[data-say]').forEach(b => b.onclick = e => { e.stopPropagation(); say(b.dataset.say); });
}

/* ---------- placement and entry tests ---------- */
const cjk = s => esc(s).replace(/[一-鿿][一-鿿，。？！、]*/g, m => `<span class="zh" style="font-size:1.12em">${m}</span>`);
function startTest(kind, level){
  let qs;
  if (kind === 'placement'){
    qs = [];
    for (let n = 1; n < MAXAVAIL(); n++) if (BANKS[n]) qs.push(...shuffle(BANKS[n]).slice(0,3).map(q => ({...q, lv:n})));
  } else qs = shuffle(BANKS[level-1]).map(q => ({...q, lv:level-1}));
  qs = qs.map(q => { const idx = shuffle(q.o.map((_,i)=>i)); return {...q, o: idx.map(i=>q.o[i]), a: idx.indexOf(q.a)}; });
  const z = () => Object.fromEntries([1,2,3,4,5,6,7,8,9].map(n => [n,0]));
  test = {kind, level: level||0, qs, i:0, score:0, by:z(), asked:z(), missed:[], answered:false};
  tab = 'lessons'; renderTabs(); render(); window.scrollTo(0,0);
}
function viewTest(){
  const v = $('#view'), t = test;
  if (t.i >= t.qs.length) return viewTestResult(v);
  const q = t.qs[t.i];
  const title = t.kind==='placement' ? 'ทดสอบวัดระดับ' : `ทดสอบเข้าห้องระดับ ${t.level}`;
  v.innerHTML = `
    <div class="row" style="justify-content:space-between"><h2 style="margin:0">${title}</h2><button class="btn" id="tQuit">ออกจากแบบทดสอบ</button></div>
    <div class="bar" style="margin-top:12px" aria-hidden="true"><i style="width:${t.i/t.qs.length*100}%"></i></div>
    <p class="small muted">ข้อ ${t.i+1} จาก ${t.qs.length}${t.kind==='entry' ? ' · ต้องได้ 6 ข้อขึ้นไปจึงผ่าน' : ''}</p>
    <div class="card">
      <p style="margin:0"><strong>${cjk(q.q)}</strong></p>
      <div class="opts">${q.o.map((o,i)=>`<button class="opt" data-o="${i}">${cjk(o)}</button>`).join('')}</div>
      <div id="tFb"></div>
    </div>`;
  $('#tQuit').onclick = () => { test = null; render(); };
  v.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    if (t.answered) return;
    t.answered = true;
    const pick = +b.dataset.o, ok = pick === q.a;
    v.querySelectorAll('.opt').forEach((x,i) => { x.disabled = true; if (i===q.a) x.classList.add('ok'); });
    if (!ok) b.classList.add('no');
    if (ok){ t.score++; t.by[q.lv]++; } else t.missed.push(q);
    t.asked[q.lv]++;
    if (t.kind==='placement'){ const nx = t.qs[t.i+1]; if ((!nx || nx.lv !== q.lv) && t.by[q.lv] < 2) t.qs = t.qs.slice(0, t.i+1); }
    const last = t.i === t.qs.length-1;
    $('#tFb').innerHTML = `<div class="fb ${ok?'ok':'no'}"><strong>${ok?'ถูกต้อง':'ยังไม่ถูก'}</strong> ${cjk(q.w)}</div><div class="row" style="margin-top:12px"><button class="btn primary" id="tNext">${last?'ดูผล':'ข้อต่อไป'}</button></div>`;
    $('#tNext').onclick = () => { t.i++; t.answered = false; render(); window.scrollTo(0,0); };
  });
}
function viewTestResult(v){
  const t = test;
  const missed = t.missed.length ? `<h3>ข้อที่ควรทบทวน</h3>${t.missed.map(q=>`<div class="ex"><div>${cjk(q.q)}</div><div class="small muted">${cjk(q.w)}</div><div></div></div>`).join('')}` : '';
  if (t.kind === 'placement'){
    const s = t.by; let ready = 1;
    for (let n = 1; n < MAXAVAIL(); n++){ if (t.asked[n] && s[n] >= 2) ready = n + 1; else break; }
    profile.tested = true; profile.rec = ready; profile.max = Math.max(profile.max, ready); saveProfile(); updateProg();
    const msg = ready===1 ? 'เริ่มจากห้องระดับ 1 เพื่อปูพื้นฐานให้แน่นก่อน' : `ผ่านพื้นฐานถึงระดับ ${ready-1} แล้ว เปิดห้องระดับ ${ready} ให้แล้ว ห้องก่อนหน้าทบทวนได้ทุกเมื่อ`;
    const rows = [1,2,3,4,5,6,7,8,9].filter(n => t.asked[n]);
    v.innerHTML = `
      <div class="card" style="text-align:center">
        <div style="font-size:2.6rem">${LEVELS[ready-1].em}</div>
        <h2>ห้องที่เหมาะกับคุณ: ${LEVELS[ready-1].name}</h2>
        <p class="muted">${msg}</p>
        <div style="text-align:left;max-width:420px;margin:12px auto">${rows.map(n=>`<div class="small" style="margin-top:8px">${LEVELS[n-1].name}: ${s[n]}/${t.asked[n]}</div><div class="bar"><i style="width:${s[n]/t.asked[n]*100}%"></i></div>`).join('')}</div>
        <div class="row" style="justify-content:center;margin-top:14px"><button class="btn primary" id="rGo">เข้าห้องระดับ ${ready}</button><button class="btn" id="rAgain">ทำแบบทดสอบอีกครั้ง</button></div>
      </div>${missed}`;
    $('#rGo').onclick = () => { test = null; openLevel = ready; openLesson = null; render(); window.scrollTo(0,0); };
    $('#rAgain').onclick = () => startTest('placement');
    return;
  }
  const pass = t.score >= 6;
  if (pass){ profile.max = Math.max(profile.max, t.level); saveProfile(); updateProg(); }
  v.innerHTML = `
    <div class="card" style="text-align:center">
      <div style="font-size:2.6rem">${pass?'🔓':'📚'}</div>
      <h2>${pass ? `ผ่านแล้ว ปลดล็อกห้องระดับ ${t.level}` : `ได้ ${t.score} จาก 8 ข้อ ยังไม่ถึงเกณฑ์`}</h2>
      <p class="muted">${pass ? `คุณได้ ${t.score} จาก 8 ข้อ เข้าห้องได้เลย` : `ต้องได้ 6 ข้อขึ้นไปจึงเข้าห้องระดับ ${t.level} ได้ ลองทบทวนห้องระดับ ${Math.min(profile.max, t.level-1)} ซึ่งเป็นระดับสูงสุดที่คุณปลดล็อกแล้ว แล้วกลับมาทดสอบใหม่`}</p>
      <div class="bar"><i style="width:${t.score/8*100}%"></i></div>
      <div class="row" style="justify-content:center;margin-top:14px">
        ${pass ? `<button class="btn primary" id="rGo">เข้าห้องระดับ ${t.level}</button>` : `<button class="btn primary" id="rReview">ทบทวนห้องระดับ ${Math.min(profile.max, t.level-1)}</button><button class="btn" id="rAgain">ทำแบบทดสอบอีกครั้ง</button>`}
      </div>
    </div>${missed}`;
  if (pass) $('#rGo').onclick = () => { const lv = t.level; test = null; openLevel = lv; openLesson = null; render(); window.scrollTo(0,0); };
  else {
    $('#rReview').onclick = () => { const lv = Math.min(profile.max, t.level-1); test = null; openLevel = lv; openLesson = null; render(); window.scrollTo(0,0); };
    $('#rAgain').onclick = () => startTest('entry', t.level);
  }
}

/* ---------- flashcards ---------- */
let fc = {deck:[], pos:0, flip:false, filter:'all', mode:'pic'};
function fcBuild(){
  let pool = ALL.map((w,i)=>i).filter(i => lessonUnlocked(ALL[i].li) && (fc.filter==='all' || ALL[i].li === +fc.filter));
  fc.deck = shuffle(pool); fc.pos = 0; fc.flip = false;
}
function viewCards(){
  if (!fc.deck.length) fcBuild();
  const v = $('#view');
  const done = fc.pos >= fc.deck.length;
  const w = done ? null : ALL[fc.deck[fc.pos]];
  const kn = ALL.filter((x,i)=>known.has(x.zh)).length;
  v.innerHTML = `
    <h2>แฟลชการ์ด</h2>
    <div class="row" style="margin-bottom:12px">
      <label class="small muted" for="fcf">หมวด</label>
      <select id="fcf"><option value="all">ทุกบทที่ปลดล็อก</option>${LESSONS.map((l,i)=>lessonUnlocked(i)?`<option value="${i}" ${fc.filter==String(i)?'selected':''}>ระดับ ${l.lv} · ${l.th}</option>`:'').join('')}</select>
      <label class="small muted" for="fcm">ด้านหน้าการ์ด</label>
      <select id="fcm"><option value="pic" ${fc.mode==='pic'?'selected':''}>ภาพ</option><option value="zh" ${fc.mode==='zh'?'selected':''}>ตัวอักษรจีน</option></select>
    </div>
    <div class="bar" aria-hidden="true"><i style="width:${Math.min(100,fc.deck.length?fc.pos/fc.deck.length*100:0)}%"></i></div>
    <p class="small muted">การ์ดที่ ${Math.min(fc.pos+1,fc.deck.length)} จาก ${fc.deck.length} · จำได้ทั้งหมด ${kn}/${ALL.length}</p>
    ${done ? `
      <div class="card" style="text-align:center;padding:32px 16px">
        <div style="font-size:3rem">🎉</div>
        <h2>ครบสำรับแล้ว</h2>
        <p class="muted">คำที่ยังไม่แน่นจะวนกลับมาให้ทบทวนในรอบถัดไป</p>
        <button class="btn primary" id="fcAgain">สับไพ่เริ่มใหม่</button>
      </div>` : `
      <div class="card fc" id="fcCard" role="button" tabindex="0" aria-label="แตะเพื่อพลิกการ์ด">
        ${!fc.flip ? (fc.mode==='pic' ? `<div class="em" aria-hidden="true">${w.em}</div><div class="muted small">แตะเพื่อดูคำตอบ</div>` : `<div class="hz">${hzHTML(w.zh,w.py)}</div><div class="muted small">แตะเพื่อดูคำตอบ</div>`)
        : `${fc.mode==='pic' ? `<div class="em" aria-hidden="true">${w.em}</div>` : ''}
           <div class="hz">${hzHTML(w.zh,w.py)}</div>
           <div class="py">${pyHTML(w.py)}</div>
           <div class="th">${w.th}</div>
           <div class="small muted" style="max-width:420px">${w.tip}</div>
           <div class="row" style="justify-content:center"><button class="spk" data-say="${w.zh}" aria-label="ฟังเสียง">🔊</button></div>`}
      </div>
      <div class="row" style="justify-content:center;margin-top:12px">
        <button class="btn" id="fcNo" ${fc.flip?'':'disabled'}>ยังไม่แน่น</button>
        <button class="btn primary" id="fcYes" ${fc.flip?'':'disabled'}>จำได้</button>
      </div>`}`;
  $('#fcf').onchange = e => { fc.filter = e.target.value; fcBuild(); render(); };
  $('#fcm').onchange = e => { fc.mode = e.target.value; fc.flip = false; render(); };
  if (done){ $('#fcAgain').onclick = () => { fcBuild(); render(); }; return; }
  const flip = () => { fc.flip = !fc.flip; render(); };
  $('#fcCard').onclick = flip;
  $('#fcCard').onkeydown = e => { if (e.key==='Enter' || e.key===' '){ e.preventDefault(); flip(); } };
  $('#fcYes').onclick = () => { known.add(w.zh); store.set('cvt_known',[...known]); fc.pos++; fc.flip=false; render(); };
  $('#fcNo').onclick = () => { known.delete(w.zh); store.set('cvt_known',[...known]); const idx = fc.deck[fc.pos]; fc.deck.splice(fc.pos,1); fc.deck.splice(Math.min(fc.pos+3, fc.deck.length),0,idx); fc.flip=false; render(); };
}

/* ---------- quiz ---------- */
let quizFilter = null, quiz = null;
function buildQuiz(){
  const pool = ALL.filter(w => lessonUnlocked(w.li) && (quizFilter===null || w.li===quizFilter));
  const picks = shuffle(pool).slice(0, quizFilter===null ? 6 : 4);
  const qs = picks.map((w,i) => ({type: (!w.abs && i%2===0) ? 'pic' : 'mean', w}));
  const exPool = EXAMPLES.filter(e => lessonUnlocked(e.li) && (quizFilter===null || e.li===quizFilter));
  shuffle(exPool).slice(0, 2).forEach(e => qs.push({type:'order', e}));
  quiz = {qs: shuffle(qs), i:0, score:0, wrong:[], answered:false, placed:[], tiles:[]};
}
function distract(w, key){
  const others = shuffle(ALL.filter(x => lessonUnlocked(x.li) && x.zh !== w.zh && (key==='th' ? x.th !== w.th : true))).slice(0,3);
  return shuffle([w, ...others]);
}
function viewQuiz(){
  const v = $('#view');
  if (!quiz) buildQuiz();
  const head = `<h2>ฝึกหัด${quizFilter!==null?`: ${LESSONS[quizFilter].th}`:''}</h2>
    <div class="row" style="margin-bottom:10px"><label class="small muted" for="qf">ขอบเขต</label>
    <select id="qf"><option value="all">ทุกบทที่ปลดล็อก</option>${LESSONS.map((l,i)=>lessonUnlocked(i)?`<option value="${i}" ${quizFilter===i?'selected':''}>ระดับ ${l.lv} · ${l.th}</option>`:'').join('')}</select></div>`;
  const bind = () => { $('#qf').onchange = e => { quizFilter = e.target.value==='all' ? null : +e.target.value; quiz = null; render(); }; };
  if (quiz.i >= quiz.qs.length){
    const total = quiz.qs.length;
    v.innerHTML = head + `
      <div class="card" style="text-align:center">
        <div style="font-size:2.6rem">${quiz.score===total?'🏆':'👍'}</div>
        <h2>ได้ ${quiz.score} จาก ${total} ข้อ</h2>
        <div class="bar"><i style="width:${quiz.score/total*100}%"></i></div>
        ${quiz.wrong.length ? `<h3>จุดที่ควรทบทวน</h3><div style="text-align:left">${quiz.wrong.map(x=>`<div class="ex"><div>${x.label}</div><div></div></div>`).join('')}</div>` : '<p class="muted">ไม่มีข้อผิดเลย เก่งมาก ลองบทถัดไปหรือสลับเป็น "ทุกบท" ได้</p>'}
        <div class="row" style="justify-content:center;margin-top:14px"><button class="btn primary" id="qAgain">ทำชุดใหม่</button></div>
      </div>`;
    bind(); $('#qAgain').onclick = () => { quiz = null; render(); }; return;
  }
  const q = quiz.qs[quiz.i];
  const prog = `<p class="small muted">ข้อ ${quiz.i+1} จาก ${quiz.qs.length}</p>`;
  if (q.type === 'order'){
    if (!quiz.tiles.length || quiz.tilesFor !== quiz.i){
      const toks = q.e.s.filter(([t,r]) => !(r==='' && /[。，？！]/.test(t)));
      quiz.tiles = shuffle(toks.map((t,i)=>({t:t[0], r:t[1], id:i})));
      quiz.placed = []; quiz.tilesFor = quiz.i; quiz.answered = false;
    }
    const ans = q.e.s.filter(([t,r]) => !(r==='' && /[。，？！]/.test(t))).map(x=>x[0]).join('');
    v.innerHTML = head + prog + `
      <div class="card">
        <p style="margin:0 0 4px"><strong>เรียงคำให้เป็นประโยค</strong></p>
        <p style="margin:0">${q.e.th}</p>
        <div class="slot" id="slot" aria-label="พื้นที่เรียงประโยค">${quiz.placed.map(p=>`<button class="tk ${quiz.answered?'b-'+(p.r||'part'):''}" data-un="${p.id}">${p.t}</button>`).join('')}</div>
        <div class="row" id="pool">${quiz.tiles.filter(t=>!quiz.placed.find(p=>p.id===t.id)).map(t=>`<button class="tk" data-pl="${t.id}">${t.t}</button>`).join('')}</div>
        ${quiz.answered ? `<div class="fb ${quiz.ok?'ok':'no'}"><strong>${quiz.ok?'ถูกต้อง':'ยังไม่ถูก'}</strong><br><span class="zh" style="font-size:1.2rem">${segHTML(q.e.s)}</span><br><span class="small muted">${q.e.py}</span></div>
          <div class="row" style="margin-top:12px"><button class="btn primary" id="qNext">ข้อต่อไป</button></div>` :
          `<div class="row" style="margin-top:12px"><button class="btn primary" id="qCheck" ${quiz.placed.length?'':'disabled'}>ตรวจคำตอบ</button><button class="btn" id="qReset">ล้าง</button></div>`}
      </div>`;
    bind();
    v.querySelectorAll('[data-pl]').forEach(b => b.onclick = () => { if (quiz.answered) return; quiz.placed.push(quiz.tiles.find(t=>t.id===+b.dataset.pl)); render(); });
    v.querySelectorAll('[data-un]').forEach(b => b.onclick = () => { if (quiz.answered) return; quiz.placed = quiz.placed.filter(p=>p.id!==+b.dataset.un); render(); });
    if (!quiz.answered){
      $('#qReset').onclick = () => { quiz.placed = []; render(); };
      $('#qCheck').onclick = () => {
        quiz.answered = true; quiz.ok = quiz.placed.map(p=>p.t).join('') === ans;
        if (quiz.ok) quiz.score++; else quiz.wrong.push({label:`เรียงประโยค: ${q.e.th} → ${ans}`, ask:`ช่วยอธิบายลำดับคำในประโยค ${ans} (${q.e.py}) ว่าทำไมเรียงแบบนี้`});
        render();
      };
    } else $('#qNext').onclick = () => { quiz.i++; quiz.tiles = []; render(); };
    return;
  }
  // multiple choice
  if (!q.opts) q.opts = distract(q.w, q.type==='mean' ? 'th' : 'zh');
  const w = q.w;
  const label = o => q.type==='pic' ? `<span class="zh" style="font-size:1.3rem">${o.zh}</span> <span class="small muted">${pyPlain(o.py)}</span>` : o.th;
  v.innerHTML = head + prog + `
    <div class="card">
      ${q.type==='pic' ? `<div class="qbig" aria-hidden="true">${w.em}</div><p style="text-align:center;margin:6px 0 0"><strong>ภาพนี้ตรงกับคำภาษาจีนข้อใด</strong></p>`
        : `<div class="qhz">${hzHTML(w.zh,w.py)}</div><p style="text-align:center;margin:4px 0 0" class="small">${pyHTML(w.py)}</p><p style="text-align:center;margin:6px 0 0"><strong>คำนี้แปลว่าอะไร</strong></p>`}
      <div class="opts">${q.opts.map((o,i)=>`<button class="opt" data-o="${i}">${label(o)}</button>`).join('')}</div>
      <div id="fbBox"></div>
    </div>`;
  bind();
  v.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    if (quiz.answered) return;
    quiz.answered = true;
    const o = q.opts[+b.dataset.o], ok = o.zh === w.zh;
    v.querySelectorAll('.opt').forEach((x,i)=>{ x.disabled = true; if (q.opts[i].zh===w.zh) x.classList.add('ok'); });
    if (!ok) b.classList.add('no');
    if (ok) quiz.score++; else quiz.wrong.push({label:`${w.zh} ${pyPlain(w.py)} = ${w.th}`, ask:`ช่วยสอนคำว่า ${w.zh} (${pyPlain(w.py)}) ให้จำง่ายขึ้น ฉันสับสนกับคำอื่น`});
    $('#fbBox').innerHTML = `<div class="fb ${ok?'ok':'no'}"><strong>${ok?'ถูกต้อง':'ยังไม่ถูก'}</strong> <span class="zh">${w.zh}</span> ${pyPlain(w.py)} = ${w.th}<br><span class="small muted">${w.tip}</span></div><div class="row" style="margin-top:12px"><button class="btn primary" id="qNext">ข้อต่อไป</button></div>`;
    $('#qNext').onclick = () => { quiz.i++; quiz.answered = false; render(); };
  });
  quiz.answered = false;
}

      <div class="card"><strong>不 เปลี่ยนก่อนเสียง 4</strong>
        <div class="zh" style="font-size:1.6rem;margin:6px 0">不要 <button class="spk" data-say="不要" aria-label="ฟัง">🔊</button></div>
        <div class="small">bù ปกติเสียง 4 แต่ก่อนเสียง 4 อ่านเป็น <span class="t t2">bú</span> เช่น <span class="t t2">bú</span> <span class="t t4">yào</span> (ไม่เอา)</div></div>
      <div class="card"><strong>一 เปลี่ยนตามเสียงที่ตามมา</strong>
        <div class="zh" style="font-size:1.6rem;margin:6px 0">一个 · 一点儿 <button class="spk" data-say="一个" aria-label="ฟัง">🔊</button></div>
        <div class="small">ก่อนเสียง 4: <span class="t t2">yí</span> ge · ก่อนเสียง 1, 2, 3: <span class="t t4">yì</span> เช่น <span class="t t4">yì</span>diǎnr (นิดหน่อย)</div></div>
    </div>
    <div class="note">ถ้ามีเสียงอ่านให้กด 🔊 เป็นเสียงสังเคราะห์ ใช้ประกอบการฝึกเท่านั้น ถ้าอยากเทียบโทนให้ฟังเจ้าของภาษาจริงด้วย</div>
    <div class="row" style="margin-top:12px"></div>`;
}
